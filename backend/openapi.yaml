/**
 * @file openapi.yaml
 * @description KCIP Catalyst Function API — OpenAPI 3.0
 */
openapi: 3.0.3
info:
  title: Karnataka Crime Intelligence Platform (KCIP) API
  description: |
    AI-powered crime analytics APIs for Karnataka State Police.
    Implemented as Zoho Catalyst Basic I/O functions calling the existing
    Controller → Service → Repository architecture.
  version: 2.0.0
  contact:
    name: KCIP Engineering Team

servers:
  - url: https://{project}.development.catalystserverless.com/server
    variables:
      project:
        default: kcip

tags:
  - name: Authentication
  - name: FIR
  - name: Dashboard
  - name: Crime Map
  - name: Prediction
  - name: Hotspots
  - name: Crime Network
  - name: Reports
  - name: Evidence
  - name: Notifications

paths:
  /authentication:
    post:
      tags: [Authentication]
      summary: Login / Logout / Current User
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum: [login, logout, current]
        - in: query
          name: username
          schema: { type: string }
        - in: query
          name: password
          schema: { type: string }
        - in: query
          name: role
          schema:
            type: string
            enum: [Police Officer, Investigating Officer, District SP, SCRB, Administrator]
        - in: query
          name: token
          schema: { type: string }
      responses:
        '200':
          description: Auth result

  /registerfir:
    post:
      tags: [FIR]
      summary: Register FIR
      parameters:
        - in: query
          name: policeStation
          required: true
          schema: { type: string }
        - in: query
          name: district
          required: true
          schema: { type: string }
        - in: query
          name: crimeType
          required: true
          schema: { type: string }
        - in: query
          name: complainantName
          required: true
          schema: { type: string }
        - in: query
          name: incidentDate
          schema: { type: string }
        - in: query
          name: latitude
          schema: { type: number }
        - in: query
          name: longitude
          schema: { type: number }
      responses:
        '201':
          description: FIR registered

  /getfir:
    get:
      tags: [FIR]
      summary: Get FIR by number or id
      parameters:
        - in: query
          name: firNumber
          schema: { type: string }
        - in: query
          name: id
          schema: { type: string }
      responses:
        '200':
          description: FIR details

  /updatefir:
    post:
      tags: [FIR]
      summary: Update FIR
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: FIR updated

  /deletefir:
    post:
      tags: [FIR]
      summary: Delete FIR
      parameters:
        - in: query
          name: id
          required: true
          schema: { type: string }
      responses:
        '200':
          description: FIR deleted

  /dashboard:
    get:
      tags: [Dashboard, Crime Map]
      summary: Dashboard KPIs, trends, categories, officer stats, crime map
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum: [summary, trends, categories, officers, map, crimeMap]
        - in: query
          name: district
          schema: { type: string }
        - in: query
          name: startDate
          schema: { type: string, format: date }
        - in: query
          name: endDate
          schema: { type: string, format: date }
      responses:
        '200':
          description: Dashboard / GeoJSON map payload

  /crimeprediction:
    post:
      tags: [Prediction]
      summary: Generate crime prediction (AppSail AI + Data Store)
      parameters:
        - in: query
          name: district
          required: true
          schema: { type: string }
        - in: query
          name: type
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Prediction result

  /hotspotdetection:
    get:
      tags: [Hotspots]
      summary: Get or calculate hotspots
      parameters:
        - in: query
          name: district
          required: true
          schema: { type: string }
        - in: query
          name: radiusKm
          schema: { type: number }
        - in: query
          name: action
          schema:
            type: string
            enum: [list, calculate]
      responses:
        '200':
          description: Hotspot list

  /graphanalysis:
    get:
      tags: [Crime Network]
      summary: Cytoscape-compatible crime network
      parameters:
        - in: query
          name: rootNodeId
          required: true
          schema: { type: string }
        - in: query
          name: depth
          schema: { type: integer, default: 2 }
      responses:
        '200':
          description: Graph nodes and edges

  /generatereport:
    post:
      tags: [Reports]
      summary: Generate PDF report via SmartBrowz
      parameters:
        - in: query
          name: reportType
          schema:
            type: string
            enum: [DAILY, WEEKLY, DISTRICT, REPEAT_OFFENDER, CRIME_TREND]
        - in: query
          name: format
          schema: { type: string, default: PDF }
      responses:
        '200':
          description: Report metadata + download URL

  /uploadevidence:
    post:
      tags: [Evidence]
      summary: Upload evidence to Catalyst Stratus
      parameters:
        - in: query
          name: fileName
          required: true
          schema: { type: string }
        - in: query
          name: fileContent
          required: true
          schema: { type: string }
        - in: query
          name: fileType
          schema: { type: string }
        - in: query
          name: firNumber
          schema: { type: string }
      responses:
        '201':
          description: Uploaded object URL

  /notifications:
    post:
      tags: [Notifications]
      summary: Send / list / mark-read notifications
      parameters:
        - in: query
          name: action
          schema:
            type: string
            enum: [send, list, markRead, unread]
        - in: query
          name: recipientId
          schema: { type: string }
        - in: query
          name: title
          schema: { type: string }
        - in: query
          name: message
          schema: { type: string }
      responses:
        '200':
          description: Notification result

  /victim:
    post:
      tags: [FIR]
      summary: Add victim or list by FIR
  /accused:
    post:
      tags: [FIR]
      summary: Add accused / high-risk / repeat offenders
  /arrest:
    post:
      tags: [FIR]
      summary: Record arrest
  /chargesheet:
    post:
      tags: [FIR]
      summary: File chargesheet
  /repeatoffender:
    get:
      tags: [Crime Network]
      summary: Repeat offender list
  /auditlogger:
    post:
      tags: [Dashboard]
      summary: Write audit log entry

components:
  schemas:
    ApiSuccess:
      type: object
      properties:
        success: { type: boolean }
        statusCode: { type: integer }
        message: { type: string }
        data: {}
        timestamp: { type: string, format: date-time }
    GeoJSONFeatureCollection:
      type: object
      properties:
        type: { type: string, example: FeatureCollection }
        features:
          type: array
          items:
            type: object
            properties:
              type: { type: string }
              geometry:
                type: object
                properties:
                  type: { type: string, example: Point }
                  coordinates:
                    type: array
                    items: { type: number }
              properties:
                type: object
                properties:
                  firNumber: { type: string }
                  district: { type: string }
                  policeStation: { type: string }
                  crimeType: { type: string }
                  severity: { type: string }
                  time: { type: string }
